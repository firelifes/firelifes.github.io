---
layout: default
---

<style>
/* 404 页面样式 */
.not-found-container {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: calc(100vh - 200px);
  padding: 40px 20px;
}

.not-found-content {
  text-align: center;
  max-width: 500px;
}

.not-found-code {
  font-size: 120px;
  font-weight: 800;
  color: #e0e0e0;
  line-height: 1;
  margin-bottom: 20px;
  text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
}

.not-found-title {
  font-size: 28px;
  font-weight: 600;
  color: #333;
  margin-bottom: 15px;
}

.not-found-message {
  font-size: 16px;
  color: #666;
  line-height: 1.8;
  margin-bottom: 30px;
}

.not-found-actions {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 24px;
  font-size: 14px;
  font-weight: 500;
  text-decoration: none;
  border-radius: 8px;
  transition: all 0.3s;
  cursor: pointer;
}

.btn-primary {
  background-color: #2a7ae2;
  color: white;
  border: none;
}

.btn-primary:hover {
  background-color: #1d5db3;
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(42, 122, 226, 0.3);
}

.btn-secondary {
  background-color: white;
  color: #666;
  border: 1px solid #ddd;
}

.btn-secondary:hover {
  background-color: #f5f5f5;
  border-color: #ccc;
}

.btn-icon {
  font-size: 16px;
}

@media (max-width: 768px) {
  .not-found-code {
    font-size: 80px;
  }
  
  .not-found-title {
    font-size: 22px;
  }
  
  .not-found-message {
    font-size: 14px;
  }
}
</style>

<div class="not-found-container">
  <div class="not-found-content">
    <div class="not-found-code">404</div>
    <h1 class="not-found-title">文章不存在</h1>
    <p class="not-found-message">
      抱歉，您访问的文章可能已被删除、移动或不存在。<br>
      请检查网址是否正确，或返回首页继续浏览。
    </p>
    <div class="not-found-actions">
      <a href="/" class="btn btn-primary">
        <span class="btn-icon">🏠</span>
        返回首页
      </a>
      <a href="/categories.html" class="btn btn-secondary">
        <span class="btn-icon">📚</span>
        浏览分类
      </a>
      <button onclick="history.back()" class="btn btn-secondary">
        <span class="btn-icon">←</span>
        返回上一页
      </button>
    </div>
  </div>
</div>

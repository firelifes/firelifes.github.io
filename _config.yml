title: FIRE生活家
subtitle: 通往FIRE之路
name: 向往FIRE的钝刀
description: 通往FIRE之路记录
baseurl: ""
url: "https://firelifes.github.io"
locale: "zh-CN"

# Minimal Mistakes 主题
remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: "air"
markdown: kramdown

# 插件
plugins:
  - jekyll-feed
  - jekyll-archives
  - jekyll-include-cache

# 站点搜索
search: true
search_full_content: true

# 分类归档（auto-generation 关闭，改为手动管理分类页面）
jekyll-archives:
  enabled: []
  layout: archive
  permalinks:
    category: /category/:name/

# 顶部导航栏
header:
  title: "FIRE生活家"
  teaser:
  links:
    - title: "项目"
      url: /category/项目/
    - title: "知识"
      url: /category/知识/
    - title: "随笔"
      url: /category/随笔/
    - title: "关于"
      url: /about/
    - title: "更多"
      url: /categories/
      icon: "fas fa-fw fa-bars"

# 作者信息
author:
  name: "向往FIRE的钝刀"
  avatar: "/assets/images/bio-photo.jpg"
  bio: "记录通往FIRE之路"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/firelifes"

# 输出配置
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
      permalink: /category/:categories/:year/:month/:day/:title.html

# 底部链接
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/firelifes"
